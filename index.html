<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АРХИВ: ДЕЛО «БЫВШИЕ»</title>
<style>
  :root{
    --bg:#0d0f0c;
    --paper:#e8e2cf;
    --ink:#1a1a1a;
    --accent:#8b0000;
    --stamp:#c0392b;
    --mono:'Courier New', Courier, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:var(--mono);
    min-height:100vh;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 3px);
  }
  header{
    text-align:center;
    padding:24px 12px 12px;
    border-bottom:2px dashed #444;
  }
  header h1{
    font-size:clamp(18px,4vw,30px);
    letter-spacing:2px;
    color:#d4c9a8;
    text-shadow:0 0 8px rgba(192,57,43,.6);
  }
  header p{font-size:12px;color:#888;margin-top:6px;letter-spacing:1px;}

  nav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    padding:14px 8px;
    position:sticky;
    top:0;
    background:rgba(13,15,12,.95);
    z-index:50;
    border-bottom:1px solid #333;
  }
  nav button{
    background:#1c1f1a;
    color:#c9c2a8;
    border:1px solid #3a3d35;
    padding:7px 11px;
    font-family:var(--mono);
    font-size:11px;
    cursor:pointer;
    transition:.15s;
    letter-spacing:.5px;
  }
  nav button:hover{background:#2a2e26;color:#fff;}
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  main{padding:20px 12px 60px;max-width:960px;margin:0 auto;}
  .tab{display:none;animation:fade .25s ease;}
  .tab.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* Рулетка */
  .roulette-wrap{position:relative;padding:60px 10px 20px;}
  .line{
    position:relative;
    height:6px;
    background:linear-gradient(90deg,#8b0000,#c0392b,#8b0000);
    border-radius:3px;
    margin:40px 0 70px;
  }
  .dot{
    position:absolute;
    top:50%;
    transform:translate(-50%,-50%);
    width:22px;height:22px;
    border-radius:50%;
    background:#e8e2cf;
    border:3px solid #8b0000;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 0 0 0 rgba(192,57,43,.7);
  }
  .dot:hover{
    transform:translate(-50%,-50%) scale(1.4);
    background:#c0392b;
    box-shadow:0 0 0 10px rgba(192,57,43,.15);
  }
  .dot .num{
    position:absolute;
    top:-22px;left:50%;transform:translateX(-50%);
    font-size:10px;color:#888;
  }
  .popup-name{
    position:absolute;
    left:50%;top:-6px;transform:translate(-50%,-100%);
    background:var(--paper);
    color:var(--ink);
    padding:6px 14px;
    font-weight:bold;
    font-size:14px;
    border:2px solid var(--accent);
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:10;
  }
  .popup-name.show{opacity:1;top:-14px;}

  /* Досье */
  .dossier{
    background:var(--paper);
    color:var(--ink);
    padding:20px;
    border:3px solid #2a2a2a;
    position:relative;
    max-width:640px;
    margin:0 auto;
    box-shadow:8px 8px 0 rgba(0,0,0,.5);
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0 1px, transparent 1px 26px);
  }
  .dossier::before{
    content:"СОВЕРШЕННО СЕКРЕТНО";
    position:absolute;
    top:12px;right:-6px;
    background:var(--stamp);
    color:#fff;
    padding:3px 10px;
    font-size:10px;
    transform:rotate(6deg);
    letter-spacing:1px;
    border:1px solid #7a1f1f;
  }
  .dossier .deal-num{
    font-size:12px;
    color:#7a1f1f;
    letter-spacing:2px;
    margin-bottom:4px;
  }
  .dossier h2{
    font-size:22px;
    margin-bottom:14px;
    border-bottom:2px solid var(--ink);
    padding-bottom:6px;
    text-transform:uppercase;
  }
  .dossier .photo{
    width:100%;
    height:220px;
    background:#c9c2a8 center/cover no-repeat;
    border:2px solid var(--ink);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
    color:#5a5440;
    overflow:hidden;
  }
  .dossier .photo img{width:100%;height:100%;object-fit:cover;}
  .facts{list-style:none;}
  .facts li{
    padding:8px 0 8px 26px;
    border-bottom:1px dashed #999;
    position:relative;
    font-size:14px;
    line-height:1.4;
  }
  .facts li::before{
    content:"▸";
    position:absolute;left:6px;color:var(--accent);
  }
  .status{
    margin-top:14px;
    padding:8px 12px;
    background:#1a1a1a;
    color:#d4c9a8;
    font-size:12px;
    letter-spacing:1px;
    display:inline-block;
  }
  .status b{color:#e74c3c;}

  /* Викторина */
  .quiz{max-width:640px;margin:0 auto;}
  .quiz .q-box{
    background:var(--paper);
    color:var(--ink);
    padding:20px;
    border:3px solid #2a2a2a;
    box-shadow:8px 8px 0 rgba(0,0,0,.5);
    margin-bottom:16px;
  }
  .quiz .q-num{font-size:11px;color:#7a1f1f;letter-spacing:2px;margin-bottom:8px;}
  .quiz .q-text{font-size:16px;margin-bottom:14px;font-weight:bold;}
  .quiz .answers{display:flex;flex-direction:column;gap:8px;}
  .quiz .answers button{
    text-align:left;
    padding:10px 14px;
    background:#f2eddc;
    border:2px solid #2a2a2a;
    font-family:var(--mono);
    font-size:14px;
    cursor:pointer;
    transition:.15s;
    color:var(--ink);
  }
  .quiz .answers button:hover{background:#1a1a1a;color:#e8e2cf;}
  .quiz .answers button.correct{background:#27ae60;color:#fff;border-color:#27ae60;}
  .quiz .answers button.wrong{background:#c0392b;color:#fff;border-color:#c0392b;}
  .quiz .answers button:disabled{cursor:default;}

  .final{
    text-align:center;
    padding:30px 16px;
    background:var(--paper);
    color:var(--ink);
    border:3px solid #2a2a2a;
    box-shadow:8px 8px 0 rgba(0,0,0,.5);
    max-width:560px;
    margin:20px auto;
  }
  .final .meme{font-size:90px;line-height:1;margin-bottom:14px;}
  .final h2{color:#7a1f1f;font-size:20px;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;}
  .final p{font-size:14px;line-height:1.5;}
  .final button{
    margin-top:16px;
    background:var(--accent);color:#fff;border:none;
    padding:10px 20px;font-family:var(--mono);cursor:pointer;font-size:13px;letter-spacing:1px;
  }
  .hint{font-size:11px;color:#888;text-align:center;margin-top:16px;}
</style>
</head>
<body>

<header>
  <h1>АРХИВ ДЕЛО «БЫВШИЕ»</h1>
  <p>11 объектов · гриф: для внутреннего использования</p>
</header>

<nav id="nav"></nav>

<main>

  <!-- РУЛЕТКА -->
  <section class="tab active" id="tab-roulette">
    <div class="roulette-wrap">
      <p style="text-align:center;color:#aaa;font-size:13px;margin-bottom:10px;">
        Нажми на точку — узнай, кто был на этом этапе
      </p>
      <div class="line" id="timeline">
        <div class="popup-name" id="popupName"></div>
      </div>
    </div>
  </section>

  <!-- ДОСЬЕ -->
  <section class="tab" id="tab-boys"></section>

  <!-- ВИКТОРИНА -->
  <section class="tab" id="tab-quiz">
    <div class="quiz" id="quizWrap"></div>
  </section>

</main>

<script>
/* ===== ДАННЫЕ ===== */
const boys = [
  {
    name:"Паша Малоземов",
    facts:[
      "Первый официальный молодой человек.",
      "Футболист, не русский.",
      "Она до сих пор говорит: «Уеду в Химки к Паше Малоземову». Изменила ему со следующим парнем."
    ],
    status:"Статус: <b>легенда Химок</b>",
    meme:"⚽",
    photo:""
  },
  {
    name:"Миша Чечель",
    facts:[
      "Хоккеист, «греческий полубог».",
      "У него нет зуба.",
      "Встречается с блондинкой (характеристику уточняйте у заказчика)."
    ],
    status:"Статус: <b>полубог с дефектом</b>",
    meme:"🏒",
    photo:""
  },
  {
    name:"Егор Кончинов",
    facts:[
      "Она его любит. Скейтер.",
      "Она ему сосала под дымок (песня такая).",
      "Обосралась в поле вместе с ним — и он её бросил после этого, перед ЕГЭ."
    ],
    status:"Статус: <b>травма перед ЕГЭ</b>",
    meme:"🛹",
    photo:""
  },
  {
    name:"Влад Шилов",
    facts:[
      "Любимое увлечение — пиво.",
      "Сошелся с бывшей блондинкой и расстался, потому что «лучше Саши никого не нашёл».",
      "Сестра Вика Ежевика, отец Витёк Писюлек. Мать — имя уточнить."
    ],
    status:"Статус: <b>пивной романтик</b>",
    meme:"🍺",
    photo:""
  },
  {
    name:"Артём Казаков",
    facts:[
      "Похож на «губатого козла». Баскетболист.",
      "Наркоман.",
      "Целовались на веранде на даче у друзей — после этого он её не трахнул."
    ],
    status:"Статус: <b>не довёл до конца</b>",
    meme:"🏀",
    photo:""
  },
  {
    name:"Артём Григорян",
    facts:[
      "Армянин. Любовь на всю жизнь.",
      "Был папин мерс, который он въебал — теперь Киа.",
      "Похож на Илью Сатира. Ассоциируется с песней «Танцы под луной»."
    ],
    status:"Статус: <b>мерс ушёл, любовь осталась</b>",
    meme:"🚗",
    photo:""
  },
  {
    name:"Дима Брокле",
    facts:[
      "100% пиздит всех своих девушек.",
      "Облизал ей всю шею.",
      "У неё от него пошла сыпь."
    ],
    status:"Статус: <b>аллерген</b>",
    meme:"🤢",
    photo:""
  },
  {
    name:"Виктор Ширяев",
    facts:[
      "Баскетболист из медиа-баскета, рост 210 см.",
      "Блоггер.",
      "Кинул её в чёрный список."
    ],
    status:"Статус: <b>заблокирована</b>",
    meme:"📱",
    photo:""
  },
  {
    name:"Семён",
    facts:[
      "Так и не привёз икру.",
      "Дарил букет роз — «спасибо, что не венерический».",
      "Находясь в отношениях, писал моей подруге о том, как хочет любви, и какой он чмо."
    ],
    status:"Статус: <b>икра не доставлена</b>",
    meme:"🌹",
    photo:""
  },
  {
    name:"Федя",
    facts:[
      "Из Тольятти.",
      "Целовался со мной и с этой подругой одновременно.",
      "После этого предлагал отношения, у них «свадьба через год». Прекрасный водитель — прогнулся за 7 минут, отвёз в Гарибальди."
    ],
    status:"Статус: <b>водитель года</b>",
    meme:"🚕",
    photo:""
  },
  {
    name:"Марат",
    facts:[
      "Снимался в «Слове пацана».",
      "Фут-фетишист, чуть её не изнасиловал.",
      "Подарил 5000."
    ],
    status:"Статус: <b>опасный объект</b>",
    meme:"🎬",
    photo:""
  }
];

/* ===== ВИКТОРИНА ===== */
const quiz = [
  {q:"Кто футболист и не русский?", a:"Паша Малоземов", opts:["Паша Малоземов","Миша Чечель","Артём Казаков"]},
  {q:"У кого нет зуба и он «греческий полубог»?", a:"Миша Чечель", opts:["Миша Чечель","Егор Кончинов","Дима Брокле"]},
  {q:"Кто бросил её после того, как они обосрались в поле перед ЕГЭ?", a:"Егор Кончинов", opts:["Влад Шилов","Егор Кончинов","Федя"]},
  {q:"Кто сошёлся с блондинкой, а потом сказал, что «лучше Саши никого не нашёл»?", a:"Влад Шилов", opts:["Влад Шилов","Семён","Виктор Ширяев"]},
  {q:"Кто наркоман и после поцелуя на веранде её не трахнул?", a:"Артём Казаков", opts:["Артём Григорян","Артём Казаков","Марат"]},
  {q:"У кого был папин мерс, который он въебал, и кто похож на Илью Сатира?", a:"Артём Григорян", opts:["Артём Григорян","Паша Малоземов","Федя"]},
  {q:"После кого у неё пошла сыпь на шее?", a:"Дима Брокле", opts:["Дима Брокле","Семён","Виктор Ширяев"]},
  {q:"Кто баскетболист 210 см, блоггер и кинул её в чёрный список?", a:"Виктор Ширяев", opts:["Артём Казаков","Виктор Ширяев","Марат"]},
  {q:"Кто так и не привёз икру и писал подруге о любви?", a:"Семён", opts:["Семён","Федя","Паша Малоземов"]},
  {q:"Кто из Тольятти целовался с ней и с подругой одновременно?", a:"Федя", opts:["Федя","Марат","Миша Чечель"]},
  {q:"Кто снимался в «Слове пацана», фут-фетишист и подарил 5000?", a:"Марат", opts:["Марат","Артём Григорян","Дима Брокле"]},
  // вопрос без правильного ответа
  {q:"Кто из парней нравится вашим подругам больше всего?", a:null, opts:["Паша Малоземов","Артём Григорян","Федя","Никто, они все так себе"]}
];

/* ===== РЕНДЕР НАВИГАЦИИ ===== */
const nav = document.getElementById('nav');
const tabs = [
  {id:'roulette', label:'РУЛЕТКА'},
  ...boys.map((b,i)=>({id:'boy'+i, label:'ДЕЛО №'+(i+1)})),
  {id:'quiz', label:'ВИКТОРИНА'}
];

tabs.forEach((t,i)=>{
  const btn = document.createElement('button');
  btn.textContent = t.label;
  btn.dataset.tab = t.id;
  if(i===0) btn.classList.add('active');
  btn.onclick = ()=>switchTab(t.id, btn);
  nav.appendChild(btn);
});

function switchTab(id, btn){
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(id==='roulette'){ document.getElementById('tab-roulette').classList.add('active'); }
  else if(id==='quiz'){ document.getElementById('tab-quiz').classList.add('active'); }
  else {
    const idx = +id.replace('boy','');
    renderDossier(idx);
    document.getElementById('tab-boys').classList.add('active');
  }
}

/* ===== РУЛЕТКА ===== */
const timeline = document.getElementById('timeline');
const popup = document.getElementById('popupName');
boys.forEach((b,i)=>{
  const dot = document.createElement('div');
  dot.className='dot';
  dot.style.left = ((i+0.5)/boys.length*100)+'%';
  dot.innerHTML = '<span class="num">'+(i+1)+'</span>';
  dot.onclick = (e)=>{
    e.stopPropagation();
    popup.textContent = b.name;
    popup.classList.add('show');
    popup.style.left = dot.style.left;
    popup.style.top = '-46px';
    popup.style.transform = 'translateX(-50%)';
    clearTimeout(window._pt);
    window._pt = setTimeout(()=>popup.classList.remove('show'), 2200);
  };
  timeline.appendChild(dot);
});
document.addEventListener('click', ()=>popup.classList.remove('show'));

/* ===== ДОСЬЕ ===== */
function renderDossier(idx){
  const b = boys[idx];
  const wrap = document.getElementById('tab-boys');
  const photoHtml = b.photo
    ? `<img src="${b.photo}" alt="${b.name}">`
    : `<span>${b.meme}</span>`;
  wrap.innerHTML = `
    <div class="dossier">
      <div class="deal-num">ДЕЛО №${idx+1} / 11 · АРХИВ</div>
      <h2>${b.name}</h2>
      <div class="photo">${photoHtml}</div>
      <ul class="facts">
        ${b.facts.map(f=>`<li>${f}</li>`).join('')}
      </ul>
      <div class="status">${b.status}</div>
    </div>
    <p class="hint">Нажми на другую вкладку сверху, чтобы открыть следующее дело</p>
  `;
}

/* ===== ВИКТОРИНА ===== */
const quizWrap = document.getElementById('quizWrap');
let qIndex = 0;
let score = 0;

function renderQuiz(){
  if(qIndex >= quiz.length){ renderFinal(); return; }
  const item = quiz[qIndex];
  quizWrap.innerHTML = `
    <div class="q-box">
      <div class="q-num">ВОПРОС ${qIndex+1} / ${quiz.length}</div>
      <div class="q-text">${item.q}</div>
      <div class="answers">
        ${item.opts.map(o=>`<button data-opt="${o}">${o}</button>`).join('')}
      </div>
    </div>
    <p class="hint">Правильный ответ подсветится зелёным, неправильный — красным</p>
  `;
  quizWrap.querySelectorAll('.answers button').forEach(btn=>{
    btn.onclick = ()=>{
      const chosen = btn.dataset.opt;
      quizWrap.querySelectorAll('.answers button').forEach(b=>b.disabled=true);
      if(item.a === null){
        // вопрос без правильного ответа — любой вариант ок
        btn.classList.add('correct');
      } else if(chosen === item.a){
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('wrong');
        quizWrap.querySelectorAll('.answers button').forEach(b=>{
          if(b.dataset.opt === item.a) b.classList.add('correct');
        });
      }
      setTimeout(()=>{ qIndex++; renderQuiz(); }, 900);
    };
  });
}

function renderFinal(){
  quizWrap.innerHTML = `
    <div class="final">
      <div class="meme">🤡</div>
      <h2>Поздравляем!</h2>
      <p>Вот так и не потрахались до конца обучения.</p>
      <p style="margin-top:10px;font-size:12px;color:#555;">Правильных ответов: ${score} из ${quiz.length}</p>
      <button onclick="qIndex=0;score=0;renderQuiz();">ПРОЙТИ ЗАНОВО</button>
    </div>
  `;
}

renderQuiz();
</script>
</body>
</html>
